apiVersion: v2
name: adapt
description: |
  Quadient Inspire Adapt — License Server with optional integration into
  the Inspire Scaler workflow via a Kustomize post-renderer overlay.
type: application

# Refarch SemVer line, decoupled from upstream Adapt component versions.
# See: ~/.claude/projects/-Users-r-tucker-Projects-adapt-k8s/memory/ for
# the SPT charts versioning philosophy.
version: 1.0.0

# The InspireAdapt installer package version this chart deploys.
appVersion: "2.4.1.22-HF"

home: https://github.com/robertwtucker/spt-charts
sources:
  - https://github.com/robertwtucker/spt-charts
  - https://github.com/robertwtucker/quadient-adapt-k8s

maintainers:
  - name: Robert Tucker
    email: r.tucker@quadient.com

keywords:
  - quadient
  - inspire
  - adapt
  - license-server

annotations:
  com.quadient.spt.refarch.adapt-installer-version: "2.4.1.22-HF"
  com.quadient.spt.refarch.adapt-ls-version: "1.21.0.458-HF"
  com.quadient.spt.refarch.adapt-ua-version: "2.4.1.22-HF"

dependencies:
  - name: inspire
    version: "1.0.0"
    repository: "oci://ghcr.io/robertwtucker/charts"
    condition: inspire.enabled
