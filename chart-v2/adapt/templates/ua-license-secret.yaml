{{- /*
Chart-managed UA license Secret.

Renders only when .Values.ua.license is non-empty (the demo path).
The Kustomize overlay (kustomize/scaler-inject/initcontainer-patch.yaml)
adds a volume referencing this Secret by hard-coded name `adapt-ua-license`
plus a volumeMount on the deploy-ua initContainer at .Values.ua.licenseFile
(subPath: adeptua.lic, readOnly).

The license file is binary (encrypted/signed Quadient payload), so the
value must be base64-encoded before passing to Helm. Use `data:` (not
`stringData:`) so K8s stores the bytes losslessly; the chart embeds the
user-provided value directly without further encoding.

Constraint: only one Adapt release per namespace can use this demo path —
the Secret name is intentionally not release-prefixed to match the
overlay's hard-coded reference. Fork the chart if you need multiple
Adapt releases in a single namespace.

Populate via:
  helm install <release> <chart> \
    --set ua.license=$(base64 -i ./adeptua.lic | tr -d '\n')
*/}}
{{- if .Values.ua.license }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "adapt.ua.licenseSecretName" . }}
  labels:
    {{- include "adapt.labels" . | nindent 4 }}
    app.kubernetes.io/component: ua
type: Opaque
data:
  adeptua.lic: {{ .Values.ua.license | trim | quote }}
{{- end }}
