{{- /*
Chart-managed License Server license Secret.

Renders only when .Values.licenseServer.license is non-empty (the demo
path). Auto-mounted by the LS Deployment as a file at .licenseFile.

The license file is binary (encrypted/signed Quadient payload), so the
value must be base64-encoded before passing to Helm. Use `data:` (not
`stringData:`) so K8s stores the bytes losslessly; the chart embeds the
user-provided value directly without further encoding.

Expert path (consumer mounts /opt/adapt/etc/ from their own
Secret/ConfigMap/PVC via .licenseServer.volumes + .volumeMounts): leave
.licenseServer.license empty and this Secret won't render.

Populate via:
  helm install <release> <chart> \
    --set licenseServer.license=$(base64 -i ./LicSer.lic | tr -d '\n')
*/}}
{{- if .Values.licenseServer.license }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "adapt.licenseServer.licenseSecretName" . }}
  labels:
    {{- include "adapt.licenseServer.labels" . | nindent 4 }}
type: Opaque
data:
  LicSer.lic: {{ .Values.licenseServer.license | trim | quote }}
{{- end }}
