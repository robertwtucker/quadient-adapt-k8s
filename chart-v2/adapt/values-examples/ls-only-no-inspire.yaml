# LS-only install — no Inspire subchart, no Scaler-side UA injection.
#
# Use this when:
#   - You want a standalone License Server for testing or development
#   - You're running the Adapt LS pod alongside an Inspire deployment
#     that is *not* managed by this chart (separate Helm release)
#
# Install (license file is binary; base64-encode before passing):
#   helm install adapt /path/to/chart-v2/adapt \
#     --values /path/to/values-examples/ls-only-no-inspire.yaml \
#     --set licenseServer.license=$(base64 -i ./LicSer.lic | tr -d '\n')
#
# Note: --post-renderer is safe to include or omit. With this values
# file, the post-renderer's safety check detects no `inspire-scaler`
# Deployment and passes through unchanged. (See kustomize-post.sh.)
#
# UA is not deployed in LS-only mode (UA only deploys via the Scaler
# overlay), so ua.license is irrelevant here. Setting it would render
# an unused chart-managed Secret — harmless but dead config.

inspire:
  enabled: false
