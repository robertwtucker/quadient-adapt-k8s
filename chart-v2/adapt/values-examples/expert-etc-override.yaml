# Expert path — consumer mounts /opt/adapt/etc/ from their own Secret
# (or ConfigMap or PVC), bypassing the chart-managed Secret + ConfigMap.
#
# Use this when:
#   - You want full control over the LS Pod's /opt/adapt/etc/ tree
#     (license + cdplicser.cfg + any future config files in one place)
#   - You already have a Secret in the target namespace bundling the
#     LS configuration files together (e.g., from an external secrets
#     manager like Vault, SealedSecrets, or External Secrets Operator)
#
# How it works:
#   The chart auto-mounts its own Secret + ConfigMap as subPath
#   (file-level) mounts at /opt/adapt/etc/LicSer.lic and
#   /opt/adapt/etc/cdplicser.cfg. When you mount a *directory* (the
#   parent path /opt/adapt/etc/), kubelet's mount-resolution gives the
#   directory mount precedence — your contents override the chart's.
#
# Install:
#   helm install adapt /path/to/chart-v2/adapt \
#     --values /path/to/values-examples/expert-etc-override.yaml
#
# Note: leave licenseServer.license empty in this mode. Setting both
# is benign (kubelet picks the directory mount), but the resulting
# chart-managed Secret would be unused — dead config.

licenseServer:
  # Leave empty — license comes from the volume mount below.
  license: ""

  volumes:
    - name: adapt-etc
      secret:
        # Pre-existing Secret in the target namespace. Required keys:
        #   - LicSer.lic       (license file content)
        #   - cdplicser.cfg    (LS daemon config)
        # Plus any additional config files your LS needs.
        secretName: my-adapt-etc-bundle
        defaultMode: 0644

  volumeMounts:
    - name: adapt-etc
      mountPath: /opt/adapt/etc
      readOnly: true

# Inspire integration is orthogonal to the expert /opt/adapt/etc override.
# This example defaults to LS-only so it can be tested standalone.
#
# To combine with integrated Inspire deployment, layer values files:
#   helm install adapt /path/to/chart-v2/adapt \
#     --values /path/to/values-examples/integrated-with-inspire.yaml \
#     --values /path/to/values-examples/expert-etc-override.yaml \
#     --post-renderer /path/to/chart-v2/adapt/kustomize-post.sh
#
# Helm applies values files in order; the later file's keys override
# the earlier file's keys at the same path. expert-etc-override.yaml
# sets licenseServer.license="" and the volumes/volumeMounts, which
# override the equivalents from integrated-with-inspire.yaml (or from
# --set-file flags).
inspire:
  enabled: false
